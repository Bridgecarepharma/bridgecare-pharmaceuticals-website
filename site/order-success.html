<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmation | Bridgecare</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header><div class="container nav"><a href="/"><img class="logo" src="/assets/images/brand/bridgecare-logo.png"></a></div></header><main class="success"><div class="container"><div class="success-badge">✓</div><h1 id="title">Confirming your payment…</h1><p id="message">Please keep this page open.</p><div id="details"></div><a class="btn btn-primary" href="/">Return home</a></div></main><script src="/assets/js/store.js"></script><script>(async()=>{const p=new URLSearchParams(location.search);const ref=p.get('reference')||p.get('trxref');if(!ref){document.getElementById('title').textContent='Payment reference missing';document.getElementById('message').textContent='Please contact Bridgecare support with your payment receipt.';return}try{const r=await fetch('/api/paystack/verify?reference='+encodeURIComponent(ref));const d=await r.json();if(!r.ok||!d.paid)throw new Error(d.error||'Payment could not be confirmed');document.getElementById('title').textContent='Payment confirmed';document.getElementById('message').textContent='Thank you. Your Bridgecare order has been received.';document.getElementById('details').innerHTML=`<p><strong>Reference:</strong> ${ref}</p><p><strong>Amount:</strong> ${money(d.amount)}</p>`;localStorage.removeItem('bridgecare_cart')}catch(e){document.getElementById('title').textContent='Payment not yet confirmed';document.getElementById('message').textContent=e.message+' If you were charged, contact support with reference '+ref+'.'}})();</script></body></html>
