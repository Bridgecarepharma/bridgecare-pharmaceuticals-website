<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Bridgecare</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header><div class="container nav"><a href="/"><img class="logo" src="/assets/images/brand/bridgecare-logo.png"></a><a class="cart-pill" href="/cart.html">Cart (<span data-cart-count>0</span>)</a></div></header><main><section><div class="container split" id="product"></div></section></main><script src="/assets/js/store.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=new URLSearchParams(location.search).get('id'),p=PRODUCTS[id]||PRODUCTS.aspivit;document.title=p.name+' | Bridgecare';document.getElementById('product').innerHTML=`<div class="product-image" style="height:500px;border-radius:22px"><img src="${p.image}" alt="${p.name}"></div><div><span class="eyebrow">Bridgecare product</span><h1 style="font-size:3.6rem;line-height:1.05;margin:.8rem 0">${p.name}</h1><div class="price" style="font-size:1.6rem">${money(p.price)}</div><p>${p.desc}</p><p class="notice">Use as directed on the product pack or by a qualified healthcare professional. This product information is not intended to diagnose, treat, cure or prevent disease.</p><button class="btn btn-primary" onclick="addToCart('${p.id}')">Add to cart</button></div>`})</script></body></html>
