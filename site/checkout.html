<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Bridgecare</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header><div class="container nav"><a href="/"><img class="logo" src="/assets/images/brand/bridgecare-logo.png"></a><a class="cart-pill" href="/cart.html">Cart (<span data-cart-count>0</span>)</a></div></header><section class="page-hero"><div class="container"><h1>Secure checkout</h1><p>Enter your delivery details before payment.</p></div></section><main><section><form id="checkout" class="container checkout-layout"><div class="panel"><h2>Delivery details</h2><div class="field"><label>Full name</label><input name="name" required autocomplete="name"></div><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Phone number</label><input name="phone" type="tel" required autocomplete="tel"></div><div class="field"><label>Full delivery address</label><textarea name="address" required rows="3"></textarea></div><div class="field"><label>Landmark</label><input name="landmark"></div><div class="field"><label>State</label><select name="state" id="state" required><option value="">Select state</option><option value="Lagos">Lagos</option><option value="Abuja">Abuja (FCT)</option><option value="Ogun">Ogun</option><option value="Rivers">Rivers</option><option value="Other">Other state</option></select></div><div class="field"><label>Delivery instructions</label><textarea name="instructions" rows="2"></textarea></div><div class="notice">You will be redirected to Paystack to complete payment securely.</div></div><aside class="panel"><h2>Your order</h2><div id="order-items"></div><div class="summary-line"><span>Subtotal</span><strong id="subtotal">₦0</strong></div><div class="summary-line"><span>Delivery</span><strong id="delivery">₦0</strong></div><div class="summary-line total"><span>Total</span><strong id="total">₦0</strong></div><button id="pay" class="btn btn-primary" style="width:100%;margin-top:1rem" type="submit">Pay securely</button><p id="error" style="color:#a32121"></p></aside></form></section></main><script src="/assets/js/store.js"></script><script>let shipping=0;function calcShipping(s){return s==='Lagos'?2500:s==='Ogun'?3000:s==='Abuja'?4500:s==='Rivers'?5000:s?5500:0}function render(){const items=cartItems();document.getElementById('order-items').innerHTML=items.map(i=>`<div class="summary-line"><span>${i.name} × ${i.qty}</span><strong>${money(i.subtotal)}</strong></div>`).join('')||'<p>Your cart is empty.</p>';document.getElementById('subtotal').textContent=money(cartTotal());document.getElementById('delivery').textContent=money(shipping);document.getElementById('total').textContent=money(cartTotal()+shipping)}document.addEventListener('DOMContentLoaded',()=>{render();document.getElementById('state').addEventListener('change',e=>{shipping=calcShipping(e.target.value);render()});document.getElementById('checkout').addEventListener('submit',async e=>{e.preventDefault();const items=cartItems();if(!items.length){document.getElementById('error').textContent='Your cart is empty.';return}const btn=document.getElementById('pay');btn.disabled=true;btn.textContent='Preparing payment…';const f=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/paystack/initialize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer:f,items,shipping,total:cartTotal()+shipping})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to start payment');sessionStorage.setItem('bridgecare_order',JSON.stringify({customer:f,items,shipping,total:cartTotal()+shipping,reference:data.reference}));location.href=data.authorization_url}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false;btn.textContent='Pay securely'}})});</script></body></html>
