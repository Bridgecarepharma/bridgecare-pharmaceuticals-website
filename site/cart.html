<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | Bridgecare</title><link rel="stylesheet" href="/assets/css/styles.css"></head><body><header><div class="container nav"><a href="/"><img class="logo" src="/assets/images/brand/bridgecare-logo.png"></a><a class="cart-pill" href="/cart.html">Cart (<span data-cart-count>0</span>)</a></div></header><section class="page-hero"><div class="container"><h1>Your cart</h1><p>Review your products before checkout.</p></div></section><main><section><div class="container cart-layout"><div class="panel" id="cart-items"></div><aside class="panel"><h2>Order summary</h2><div class="summary-line"><span>Subtotal</span><strong id="subtotal">₦0</strong></div><p style="color:var(--muted)">Delivery is calculated at checkout.</p><a class="btn btn-primary" style="width:100%" href="/checkout.html">Proceed to checkout</a></aside></div></section></main><script src="/assets/js/store.js"></script><script>document.addEventListener('DOMContentLoaded',render);function render(){const box=document.getElementById('cart-items'),items=cartItems();if(!items.length){box.innerHTML='<h2>Your cart is empty</h2><p>Add a product from the shop to begin.</p><a class="btn btn-primary" href="/#products">Shop products</a>';document.getElementById('subtotal').textContent=money(0);return}box.innerHTML=items.map(i=>`<div class="cart-row"><img src="${i.image}" alt=""><div><strong>${i.name}</strong><div>${money(i.price)}</div></div><div class="qty"><button onclick="change('${i.id}',-1)">−</button><span>${i.qty}</span><button onclick="change('${i.id}',1)">+</button><button onclick="removeItem('${i.id}')">×</button></div></div>`).join('');document.getElementById('subtotal').textContent=money(cartTotal())}function change(id,d){const c=getCart();c[id]=Math.max(0,(c[id]||0)+d);saveCart(c);render()}function removeItem(id){const c=getCart();delete c[id];saveCart(c);render()}</script></body></html>
